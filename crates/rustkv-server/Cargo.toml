[package]
name = "rustkv-server"
version = "0.1.0"
edition = "2021"

[dependencies]
bytes = "1.0"
clap = { version = "4.0", features = ["derive"] }
rustkv-core = { path = "../rustkv-core" }
rustkv-protocol = { path = "../rustkv-protocol" }
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
serde_json = "1.0"
